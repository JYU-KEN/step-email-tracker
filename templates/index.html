<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステップメール トラッキングダッシュボード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #f0f4f8; color: #222; }

  header {
    background: #1a2d4e;
    color: white;
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  header .header-links { display: flex; gap: 18px; align-items: center; }
  header a { color: #a0b4d0; font-size: 13px; text-decoration: none; }
  header a:hover { color: white; }

  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

  /* サマリーカード */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .summary-card {
    background: white;
    border-radius: 10px;
    padding: 20px 24px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }
  .summary-card .label { font-size: 12px; color: #888; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.3px; }
  .summary-card .value { font-size: 32px; font-weight: 700; color: #1a2d4e; }
  .summary-card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }
  .summary-card.highlight .value { color: #3b6ef6; }
  .summary-card.green .value { color: #27ae60; }
  .summary-card.orange .value { color: #f39c12; }

  /* テーブル */
  .table-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  .table-header {
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
    flex-wrap: wrap;
    gap: 10px;
  }
  .table-header h2 { font-size: 16px; color: #1a2d4e; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .refresh-btn {
    background: #f0f4ff;
    color: #3b6ef6;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: #dde6ff; }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }
  .link-btn { font-size:13px; color:#3b6ef6; text-decoration:none; font-weight:600; padding:7px 4px; }
  .link-btn:hover { text-decoration: underline; }

  .info-bar {
    padding: 11px 24px;
    background: #f8faff;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12.5px;
    color: #5a6b85;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: #888;
    letter-spacing: 0.4px;
    padding: 12px 16px;
    background: #fafafa;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
  }
  td { padding: 14px 16px; border-bottom: 1px solid #f7f7f7; font-size: 14px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafcff; }
  tr.thanks-row td { background: #fcfdff; }

  .subject-text { font-weight: 600; color: #1a2d4e; font-size: 14px; }
  .day-tag { display:inline-block; font-size:11px; color:#8a9bb5; margin-left:6px; }

  .rate-cell { min-width: 140px; }
  .rate-value { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .rate-bar-bg { background: #eef0f5; border-radius: 4px; height: 6px; width: 100%; }
  .rate-bar { height: 6px; border-radius: 4px; transition: width 0.6s ease; }
  .open-bar { background: linear-gradient(90deg, #3b6ef6, #6b9fff); }
  .click-bar { background: linear-gradient(90deg, #27ae60, #52d685); }

  .rate-good { color: #27ae60; }
  .rate-ok { color: #f39c12; }
  .rate-low { color: #e74c3c; }
  .rate-none { color: #c5ccd6; }

  .num-cell { font-size: 15px; font-weight: 600; color: #444; text-align: right; }
  .num-label { font-size: 11px; color: #aaa; text-align: right; margin-top: 2px; }
  .num-muted { color: #c5ccd6; }

  .loading { padding: 60px; text-align: center; color: #aaa; font-size: 15px; }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e0e6ff; border-top-color: #3b6ef6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { padding: 40px; text-align: center; color: #e74c3c; font-size: 14px; }

  .last-updated { font-size: 12px; color: #aaa; margin-top: 14px; text-align: right; }
  .reset-link { font-size: 11px; color: #c5ccd6; text-decoration: none; }
  .reset-link:hover { color: #e74c3c; }

  @media (max-width: 760px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>📧 ステップメール トラッキング</h1>
  <div class="header-links">
    <a href="/pixel-urls">📋 ピクセルURL一覧</a>
    <a href="/settings">⚙️ API設定</a>
  </div>
</header>

<div class="container">

  <!-- サマリーカード（実データ） -->
  <div class="summary-grid">
    <div class="summary-card highlight">
      <div class="label">登録者数</div>
      <div class="value" id="sum-subscribers">—</div>
      <div class="sub">Wixから自動連携</div>
    </div>
    <div class="summary-card">
      <div class="label">総開封数</div>
      <div class="value" id="sum-opens">—</div>
      <div class="sub">全メール ユニーク開封</div>
    </div>
    <div class="summary-card green">
      <div class="label">平均開封率</div>
      <div class="value" id="sum-openrate">—</div>
      <div class="sub">配信済みメールの平均</div>
    </div>
    <div class="summary-card orange">
      <div class="label">総クリック数</div>
      <div class="value" id="sum-clicks">—</div>
      <div class="sub">リンククリック合計</div>
    </div>
  </div>

  <!-- トラッキング表 -->
  <div class="table-card">
    <div class="table-header">
      <h2>👁️ メール別 開封・クリック状況</h2>
      <div class="header-actions">
        <button class="refresh-btn" id="refresh-btn" onclick="loadTracking()">🔄 更新</button>
      </div>
    </div>
    <div class="info-bar">
      ℹ️ <span>送信数は登録日からの経過日数で自動計算されます（例：Day3は3日以上前に登録した人数）。開封数は1人につき1回のみカウントします。</span>
    </div>
    <div class="table-scroll">
      <div id="tracking-container">
        <div class="loading"><div class="spinner"></div><br>読み込み中...</div>
      </div>
    </div>
  </div>

  <div class="last-updated">
    <span id="last-updated"></span>
    &nbsp;|&nbsp;
    <a href="#" class="reset-link" onclick="resetOpens(event)">テスト開封データをリセット</a>
  </div>
</div>

<script>
function rateClass(rate, sent) {
  if (sent === 0) return 'rate-none';
  if (rate >= 30) return 'rate-good';
  if (rate >= 15) return 'rate-ok';
  return 'rate-low';
}

async function loadTracking() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/tracking');
    const data = await res.json();
    if (data.error) {
      document.getElementById('tracking-container').innerHTML =
        `<div class="error-msg">⚠️ ${data.error}</div>`;
      return;
    }

    // サマリー集計
    const totalOpens = data.tracking.reduce((s, t) => s + t.opens, 0);
    const totalClicks = data.tracking.reduce((s, t) => s + t.clicks, 0);
    const sentDays = data.tracking.filter(t => t.sent > 0);
    const avgOpen = sentDays.length > 0
      ? (sentDays.reduce((s, t) => s + t.open_rate, 0) / sentDays.length).toFixed(1)
      : null;

    document.getElementById('sum-subscribers').textContent = (data.total_subscribers || 0).toLocaleString();
    document.getElementById('sum-opens').textContent = totalOpens.toLocaleString();
    document.getElementById('sum-clicks').textContent = totalClicks.toLocaleString();
    document.getElementById('sum-openrate').textContent = avgOpen !== null ? avgOpen + '%' : '—';

    // テーブル
    const rows = data.tracking.map(t => {
      const isThanks = t.day === 0;
      const sentDisplay = t.sent > 0
        ? t.sent.toLocaleString()
        : '<span class="num-muted">0</span>';
      const rateDisplay = t.sent > 0 ? t.open_rate + '%' : '—';
      const clickRateDisplay = t.sent > 0 ? t.click_rate + '%' : '—';
      return `
        <tr class="${isThanks ? 'thanks-row' : ''}">
          <td>
            <span class="subject-text">${t.label}</span>
            ${isThanks ? '<span class="day-tag">登録直後</span>' : '<span class="day-tag">登録' + t.day + '日後</span>'}
          </td>
          <td class="num-cell">${sentDisplay}<div class="num-label">送信</div></td>
          <td class="num-cell">${t.opens.toLocaleString()}<div class="num-label">開封</div></td>
          <td class="rate-cell">
            <div class="rate-value ${rateClass(t.open_rate, t.sent)}">${rateDisplay}</div>
            <div class="rate-bar-bg"><div class="rate-bar open-bar" style="width:${Math.min(t.open_rate,100)}%"></div></div>
          </td>
          <td class="num-cell">${t.clicks.toLocaleString()}<div class="num-label">クリック</div></td>
          <td class="rate-cell">
            <div class="rate-value ${rateClass(t.click_rate, t.sent)}">${clickRateDisplay}</div>
            <div class="rate-bar-bg"><div class="rate-bar click-bar" style="width:${Math.min(t.click_rate,100)}%"></div></div>
          </td>
        </tr>`;
    }).join('');

    document.getElementById('tracking-container').innerHTML = `
      <table>
        <thead><tr>
          <th>メール</th>
          <th style="text-align:right">送信数</th>
          <th style="text-align:right">開封数</th>
          <th>開封率</th>
          <th style="text-align:right">クリック数</th>
          <th>クリック率</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

    document.getElementById('last-updated').textContent =
      '最終更新: ' + new Date().toLocaleString('ja-JP');
  } catch (e) {
    document.getElementById('tracking-container').innerHTML =
      `<div class="error-msg">⚠️ サーバー接続に失敗しました<br><small>${e.message}</small></div>`;
  } finally {
    btn.disabled = false;
  }
}

async function resetOpens(ev) {
  ev.preventDefault();
  if (!confirm('開封・クリックのテストデータを全て削除します。\n登録者数は保持されます。よろしいですか？')) return;
  await fetch('/api/tracking/reset_opens', { method: 'POST' });
  loadTracking();
}

loadTracking();
// 60秒ごとに自動更新
setInterval(loadTracking, 60000);
</script>
</body>
</html>
